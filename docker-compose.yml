services:
  postgres:
    image: postgres:16-alpine
    container_name: studyradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-studyradar}
      POSTGRES_USER: ${DB_USER:-studyradar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studyradar_password}
    ports:
      - "${HOST_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-studyradar} -d ${DB_NAME:-studyradar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studyradar-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: studyradar-backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py load_gazetteer &&
             python manage.py seed_sources &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    ports:
      # Port 8000 is occupied by Portainer on host, map 8008 on host
      - "${HOST_BACKEND_PORT:-8008}:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-studyradar}
      - DB_USER=${DB_USER:-studyradar}
      - DB_PASSWORD=${DB_PASSWORD:-studyradar_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: studyradar-celery-worker
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-studyradar}
      - DB_USER=${DB_USER:-studyradar}
      - DB_PASSWORD=${DB_PASSWORD:-studyradar_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: studyradar-celery-scheduler
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-studyradar}
      - DB_USER=${DB_USER:-studyradar}
      - DB_PASSWORD=${DB_PASSWORD:-studyradar_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: studyradar-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8008/api
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
